name: Restore verified Vercel deployed source
on:
  push:
    branches:
      - feat/vercel-managed-runtime
    paths:
      - .github/workflows/restore-vercel-migration.yml

permissions:
  contents: write

concurrency:
  group: one-time-vercel-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-verified-deployment:
    if: github.repository == 'sungmpar/ft_transcendence_project' && github.ref == 'refs/heads/feat/vercel-managed-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated branch and its parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Restore verified deployed Git history
        shell: bash
        env:
          DEPLOYED_SHA: a47e87a30f717ee906c3fc89f8e2ca93769fc59d
          BUNDLE_SHA256: 84dfdfcd5dcb8797963b8df81286317e7b8b23992f757a777974dd27cae96c4a
          BUNDLE_URL: https://yus8ha55ayrgrcue.public.blob.vercel-storage.com/migration-recovery/84dfdfcd5dcb8797963b8df81286317e7b8b23992f757a777974dd27cae96c4a.bundle
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF}" = "refs/heads/feat/vercel-managed-runtime"
          test "$(git rev-parse HEAD^)" = "0ec07c8b25479c03d857505506e84183da95a547"
          curl --fail --location --silent --show-error --retry 3 --max-time 120 "$BUNDLE_URL" -o /tmp/ft-vercel-source.bundle
          printf '%s  %s\n' "$BUNDLE_SHA256" /tmp/ft-vercel-source.bundle | sha256sum --check
          git bundle verify /tmp/ft-vercel-source.bundle
          git fetch /tmp/ft-vercel-source.bundle refs/heads/feat/vercel-managed-runtime
          test "$(git rev-parse FETCH_HEAD)" = "$DEPLOYED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit FETCH_HEAD
          git rm -- .github/workflows/restore-vercel-migration.yml
          git diff --cached --quiet FETCH_HEAD --
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore: preserve Vercel deployed migration code and original commits"
          test "$(git rev-parse "$DEPLOYED_SHA^{tree}")" = "$(git rev-parse HEAD^{tree}")"
          git push origin HEAD:refs/heads/feat/vercel-managed-runtime
