version: "3"
services:
  postgres:
    image: postgres:14.5-alpine
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
      TZ: Asia/Seoul
    networks:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    volumes:
      - ./backend:/usr/src/app/backend
      - ./shared:/usr/src/app/shared:ro
      - /usr/src/app/backend/node_modules
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    networks:
      - backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: always
    volumes:
      - ./frontend:/usr/src/app/frontend
      - ./shared:/usr/src/app/shared:ro
      - /usr/src/app/frontend/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres:
